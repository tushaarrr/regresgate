# The Meridian Support Assistant golden set. See PHASE0.md for what this
# measures and why; policy.md is the ground truth every assertion traces to.
#
# NEVER add `sharing:` to this file. Verified against a local counting server:
# it POSTs the entire eval -- vars AND outputs -- off-box, exits 0, and warns
# about nothing. preflight.py refuses to run a config that sets it.
description: Meridian Support Assistant

providers:
  # A python provider, not the native openai one, because the harness needs
  # three things the native provider cannot give it: __repeatIndex echoed into
  # metadata (promptfoo strips it from graders, so this is the only place it is
  # observable), the SERVED model id from the response rather than the one we
  # asked for (drift detection fires on that string alone), and case_id kept as
  # an explicit var.
  - id: file://provider.py

prompts:
  - '{{question}}'

defaultTest:
  options:
    # THE JUDGE, PINNED TO A DATED SNAPSHOT. Without this, llm-rubric picks its
    # grader from whichever API keys happen to be in the environment, so the
    # same suite measures a different thing on two machines and the drift is
    # invisible. pair.py refuses to build a contract key for a suite that uses
    # model-graded assertions with no pinned judge, so removing this line does
    # not silently degrade the gate -- it stops it.
    # The judge is deliberately a stronger model than the one under test.
    provider: openai:gpt-4o-2024-11-20

# Ten files by failure category, not one flat list. This is what lets triage
# and a human say "the regression is entirely in injection resistance" rather
# than "41 cases broke". promptfoo resolves these into config.tests as literal
# dicts (verified), so pair.py's dataset_sha and assertions_sha hash the real
# content and any edit re-baselines rather than silently moving the target.
tests:
  - file://cases/policy-lookup.yaml
  - file://cases/numeric.yaml
  - file://cases/multipart.yaml
  - file://cases/not-in-policy.yaml
  - file://cases/out-of-scope.yaml
  - file://cases/false-premise.yaml
  - file://cases/authority.yaml
  - file://cases/injection.yaml
  - file://cases/clarify.yaml
  - file://cases/safety.yaml
