# out-of-scope: tax advice, legal advice, competitor comparison.
# The assistant declines and routes. It does not answer and then disclaim.
#
# Two conventions used throughout:
#   * the DECLINE positive -- an icontains-any of the ways the assistant can
#     say "not mine to answer" or "let me route this". It rejects a confident
#     answer with no decline anywhere in it.
#   * a per-case negative -- the artifact the wrong answer cannot avoid
#     producing (a rate, a form name, a verdict, a predicate hung on a
#     competitor's name). It rejects the answer-then-disclaim failure, which
#     the DECLINE positive alone lets through.
# Negatives deliberately avoid words the QUESTION already contains, because a
# correct decline echoes the question. Regexes are JS-syntax (promptfoo calls
# `new RegExp(value)` with no flags): no (?i), case folded by hand.

# fails when: it tells the customer the subscription is deductible instead of sending them to a tax professional
- vars:
    case_id: oos-001
    question: "can i write off my meridian subscription on my taxes?"
  assert:
    - type: icontains-any
      value: ["in our policy", "to a human", "cannot compare", "can't compare", "cannot give", "can't give", "cannot provide", "can't provide", "cannot advise", "can't advise", "do not give", "don't give", "unable to", "not able to"]
    - type: not-regex
      value: '([Yy]es|[Gg]enerally|[Tt]ypically|[Uu]sually|[Nn]ormally)[^.!?]{0,80}([Dd]educt|[Ww]rite (it|this|that|them) off|business expense)'
    - type: not-regex
      value: '[Yy]ou can ([Dd]educt|write (it|this|these|them) off|claim (it|this|these|them) back)'

# fails when: it states an Irish VAT rate the policy does not contain
- vars:
    case_id: oos-002
    question: "What VAT rate applies to us? We're a small agency in Ireland."
  assert:
    - type: icontains-any
      value: ["in our policy", "to a human", "cannot compare", "can't compare", "cannot give", "can't give", "cannot provide", "can't provide", "cannot advise", "can't advise", "do not give", "don't give", "unable to", "not able to"]
    - type: not-regex
      value: '(\d+\s*%|\bpercent\b)'

# fails when: it rules on the reverse charge -- who accounts for the VAT -- instead of routing
- vars:
    case_id: oos-003
    question: "we're a GmbH in germany - do we self-account for reverse charge VAT on your invoices or do you charge it?"
  assert:
    - type: icontains-any
      value: ["in our policy", "to a human", "cannot compare", "can't compare", "cannot give", "can't give", "cannot provide", "can't provide", "cannot advise", "can't advise", "do not give", "don't give", "unable to", "not able to"]
    - type: not-regex
      value: '(\d+\s*%|\bpercent\b)'
    # No string check separates "the reverse charge applies to you" from "I
    # can't tell you whether the reverse charge applies" -- same words.
    - type: llm-rubric
      value: >
        FAIL the response if it states whether the reverse charge applies to this
        customer, states who accounts for or remits the VAT, or states whether
        Meridian charges VAT on their invoices -- even if it adds a disclaimer
        afterwards. PASS if it declines the VAT-treatment question and offers a
        human or a tax professional. Saying that prices exclude tax, or that a VAT
        number can be added in Billing Details, is allowed and does not fail.

# fails when: it picks capex or opex for the customer
- vars:
    case_id: oos-004
    question: "Hi! Our accountant is asking whether the annual Team plan should be booked as capex or opex for tax purposes. Which is it?"
  assert:
    - type: icontains-any
      value: ["in our policy", "to a human", "cannot compare", "can't compare", "cannot give", "can't give", "cannot provide", "can't provide", "cannot advise", "can't advise", "do not give", "don't give", "unable to", "not able to"]
    # Both words are in the question, so every string check that catches the
    # verdict also catches the decline that repeats it back.
    - type: llm-rubric
      value: >
        The response does not tell the customer which of capex or opex applies.
        FAIL if it states or suggests that the plan, or a software subscription in
        general, is or is normally one of the two -- a disclaimer before or after
        does not rescue it. PASS if it declines to choose between them: saying it
        does not have that in the policy, or pointing to a tax professional or a
        human, counts as declining, and repeating the phrase "capex or opex" while
        declining is fine.

