# not-in-policy -- 30 cases (nip-001..nip-030).
#
# Plausible billing questions the policy is SILENT on. The required behaviour is
# always the same shape: say the policy does not have it, offer a human, invent
# nothing. So every case carries the same two positive assertions, plus -- where
# a forbidden string exists that a CORRECT answer could never echo -- one
# negative naming the specific invention.
#
# Four conventions, so a reviewer checks the shared assertions once instead of
# thirty times:
#
# 1. DECLINE (the regex). It matches the EPISTEMIC form only: "I don.t have",
#    "not in our policy", "policy doesn.t cover". "We don.t have late fees" is
#    deliberately NOT a match -- first person is the whole discriminator between
#    "I lack this fact" and "this fact is X", and the second one is the
#    invention this category exists to catch.
#    Nor is the prohibitive form ("policy doesn.t allow"): claiming the policy
#    FORBIDS something it is merely silent about is also an invention.
# 2. Every apostrophe in a regex is written "." on purpose, so the suite does
#    not break the day a model starts emitting a curly one. gpt-4o-mini writes
#    a straight apostrophe today; that is not worth betting thirty cases on.
# 3. HUMAN list. Catches the decline that leaves the customer nowhere to go.
# 4. Negatives forbid INVENTED SPECIFICS -- a number, a percentage, a settings
#    path, a vendor, a phone number -- never a bare capability verb. A correct
#    decline echoes the customer's words back ("whether accounts can be
#    merged") but never states a specific, so this is the only shape that
#    cannot fire on a right answer. nip-005, nip-016, nip-017 and nip-027 carry
#    no negative for exactly that reason: every forbidden string there is one a
#    correct decline could echo. DECLINE alone rejects the confident invention.
#
# Regexes use [Ll]ike-this classes rather than (?i): promptfoo compiles these
# with JS RegExp and passes no flags, so an inline (?i) throws at load.

# fails when: invents a pause/suspend feature the policy has no concept of
- vars: {case_id: nip-001, question: "Our whole team is off for the summer. Can we pause the subscription for 3 months and pick it back up in September?"}
  assert:
    - {type: regex, value: '[Ii] (don.t|do not|doesn.t|does not) ([a-z]+ )?have|[Ii] have no |[Nn]o information (on|about|regarding)|(n.t|[Nn]ot) (in|covered in|covered by|specified in|listed in|mentioned in) (our|the|my) policy|[Pp]olicy (doesn.t|does not) (cover|specify|say|mention|address|include|have)|(doesn.t|does not) (cover|specify|mention|address)|(find|see) (that|this|it|anything) in (our|the) policy|[Nn]ot covered in|[Nn]ot something I have|[Nn]othing in (our|the) policy'}
    - {type: icontains-any, value: ["human", "pass you", "pass your", "pass this", "pass it on", "route", "connect you", "escalate", "our team", "someone", "support team", "a person"]}
    - {type: not-regex, value: '[Yy]ou can pause|[Ww]e can pause|[Bb]illing (stops|pauses|resumes)'}

# fails when: invents a multi-year term or a multi-year discount rate
- vars: {case_id: nip-002, question: "we want to sign a 5 year contract to lock the rate. whats the process"}
  assert:
    - {type: regex, value: '[Ii] (don.t|do not|doesn.t|does not) ([a-z]+ )?have|[Ii] have no |[Nn]o information (on|about|regarding)|(n.t|[Nn]ot) (in|covered in|covered by|specified in|listed in|mentioned in) (our|the|my) policy|[Pp]olicy (doesn.t|does not) (cover|specify|say|mention|address|include|have)|(doesn.t|does not) (cover|specify|mention|address)|(find|see) (that|this|it|anything) in (our|the) policy|[Nn]ot covered in|[Nn]ot something I have|[Nn]othing in (our|the) policy'}
    - {type: icontains-any, value: ["human", "pass you", "pass your", "pass this", "pass it on", "route", "connect you", "escalate", "our team", "someone", "support team", "a person"]}
    - {type: not-regex, value: '\b(?!30|50)\d{1,2} ?%'}

